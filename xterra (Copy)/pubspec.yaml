name: xterra
description: "Xterra Flutter app — clean architecture base."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^14.6.3

  # State management
  provider: ^6.1.2

  # Dependency injection
  get_it: ^8.0.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Local storage / cache
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0

  # Equality helpers
  equatable: ^2.0.7

  # SVG rendering
  flutter_svg: ^2.0.10

  # File picker for KYC uploads
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/projects/
    - assets/images/floor_plans/
    - assets/images/amenities/
    - assets/images/highlights/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
